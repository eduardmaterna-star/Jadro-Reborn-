name: Validate cinematic prototype
on:
  push:
    branches: [feature/the-descent-intro-prototype]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cinematics/test-intro.cjs
