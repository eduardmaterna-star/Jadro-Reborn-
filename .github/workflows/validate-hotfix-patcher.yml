name: Validate hotfix generator
on:
  push:
    branches: [fix/v0.3.16-stability-shaders]
  pull_request:
  workflow_dispatch:
jobs:
  validate-patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile tools/apply_v0316_fixes.py
