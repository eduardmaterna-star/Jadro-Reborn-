name: JÁDRO REBORN — versioned game release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze X.Y.Z (ruční test nevytvoří GitHub Release)'
        required: true
        default: '0.3.18'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: launcher/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}"
          if ("${{ github.event_name }}" -eq "push") { $raw = "${{ github.ref_name }}" }
          $v = $raw -replace '^v',''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $raw" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check required sources
        shell: pwsh
        run: |
          foreach ($f in @('launcher/go.mod','launcher/main.go','launcher/web/game.js','scripts/release_version.py')) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing game source: $f" }
          }

      - name: Verify premium game assets
        shell: pwsh
        run: |
          $required = @(
            'launcher/save_api.go','launcher/web/index.html','launcher/web/style.css',
            'launcher/web/assets/materials/soil.png','launcher/web/assets/materials/stone.png',
            'launcher/web/assets/materials/mantle.png','launcher/web/assets/materials/basalt.png',
            'launcher/web/assets/materials/outer_core.png','launcher/web/assets/materials/inner_core.png',
            'launcher/web/assets/materials/wood.png',
            'launcher/web/assets/ores/coal.png','launcher/web/assets/ores/iron.png',
            'launcher/web/assets/ores/diamond.png','launcher/web/assets/ores/ruby.png',
            'launcher/web/assets/ores/emerald.png',
            'launcher/web/audio/ambient.ogg','launcher/web/audio/deep_layer.ogg',
            'launcher/web/audio/core_layer.ogg','launcher/web/audio/dig.wav',
            'launcher/web/audio/buy.wav','launcher/web/audio/sell.wav',
            'launcher/web/audio/ladder.wav','launcher/web/audio/wind.wav'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing required asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -eq 0) { throw "Empty required asset: $file" }
          }

      - name: Verify JavaScript syntax
        run: node --check launcher/web/game.js

      - name: Install graphics-test dependencies
        run: python -m pip install Pillow==11.3.0

      - name: Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Go tests and static analysis
        working-directory: launcher
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows x64
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GAME_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Push-Location launcher
          go build -trimpath -ldflags="-s -w -X main.GameVersion=$env:GAME_VERSION" -o "../dist/JadroReborn-v$env:GAME_VERSION-Windows-x64.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build versioned ZIPs and SHA-256
        run: python scripts/release_version.py --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: JADRO_REBORN_v${{ steps.version.outputs.version }}
          path: |
            dist/JADRO_REBORN_v${{ steps.version.outputs.version }}_WINDOWS.zip
            dist/JADRO_REBORN_v${{ steps.version.outputs.version }}_SOURCE.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on version tags
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "dist/JADRO_REBORN_v${{ steps.version.outputs.version }}_WINDOWS.zip" "dist/JADRO_REBORN_v${{ steps.version.outputs.version }}_SOURCE.zip" "dist/SHA256SUMS.txt" --title "JÁDRO REBORN $tag" --generate-notes
